[project]
name = "daily-task-tracker"
version = "0.1.0"
description = "Track daily tasks in color-coded folders, plan them on a calendar and log the time you spend."
readme = "README.md"
license = "MIT"
authors = [{ name = "Luca Villani" }]
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.scripts]
tasktracker = "tasktracker.__main__:main"
tasktracker-users = "tasktracker.users_cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasktracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
